plugins {
    id 'java'
    id 'application'
    id 'org.springframework.boot' version '4.1.0'
}

group = 'com.openclassrooms.debugging'
version = '1.0-SNAPSHOT'

repositories {
    mavenCentral()
}

java {
    sourceCompatibility = JavaVersion.VERSION_17
}

application {
    mainClass = 'com.openclassrooms.debugging.DragonSaddleSizeGuesserApp'
}

repositories {
    mavenCentral()
}

jar {
    manifest {
        attributes 'Main-Class': 'com.openclassrooms.debugging.DragonSaddleSizeGuesser'
    }
}

dependencies {
    implementation("org.springframework.boot:spring-boot-starter-actuator:4.1.0")
    implementation("org.springframework.boot:spring-boot-dependencies:4.1.0")
    implementation("org.springframework.boot:spring-boot-starter-webmvc:4.1.0")
    testImplementation("org.junit.jupiter:junit-jupiter-api:5.5.0-RC1")
    testImplementation("org.junit.jupiter:junit-jupiter-engine:5.5.0-RC1")
    testRuntimeOnly("org.junit.platform:junit-platform-launcher:1.5.0-RC1")
    testImplementation("org.hamcrest:hamcrest-core:2.1")
    testImplementation("org.mockito:mockito-junit-jupiter:2.23.0")
}

test {
    useJUnitPlatform()
}
